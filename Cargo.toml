[package]
name = "simplegit"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "Asynchronous Git daemon powering the simplegit Vim plugin (blame, history, diff, status)"
repository = "https://github.com/beamiter/simplegit"
readme = "README.md"
publish = false

[[bin]]
name = "simplegit-daemon"
path = "src/simplegit/simplegit_daemon.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "process", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
