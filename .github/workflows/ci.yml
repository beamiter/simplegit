name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # The crate declares a minimum supported Rust version; a dependency bump or a
  # newly used language feature can quietly break it, because every other job
  # runs on stable.  This is the check that caught `ignore` pulling in
  # let-chains and two crates whose own sources had outgrown their declared
  # MSRV.
  #
  # This pin sat at 1.85.0 while Cargo.toml declared 1.88, so `cargo check
  # --locked` hard-errored on the manifest before compiling anything and the
  # job was red on every push.  The guard step below derives the expectation
  # from Cargo.toml and fails loudly on a mismatch, so a future MSRV bump
  # cannot silently leave this pin behind again.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Verify the pinned toolchain matches the declared MSRV
        run: |
          declared="$(sed -n 's/^rust-version *= *"\([0-9][0-9.]*\)".*/\1/p' Cargo.toml)"
          test -n "$declared"
          installed="$(rustc --version | cut -d' ' -f2)"
          # Cargo.toml names major.minor, the action pin names a patch release.
          series() { printf '%s' "$1" | cut -d. -f1,2; }
          if [ "$(series "$installed")" != "$(series "$declared")" ]; then
            echo "MSRV drift: Cargo.toml declares $declared," \
                 "this job installed $installed." >&2
            echo "Update the dtolnay/rust-toolchain pin above to match." >&2
            exit 1
          fi
      - name: Build on the declared minimum supported Rust
        run: cargo check --all-targets --locked
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Run quality gate
        run: make check

      - name: Verify installer and daemon handshake
        run: |
          ./install.sh
          response="$(printf '%s\n' '{"type":"version","id":1}' | ./lib/simplegit-daemon)"
          grep -F '"type":"version"' <<<"$response"
          # Read the expected version from the source rather than hardcoding it;
          # this assertion has silently drifted behind two protocol bumps.
          expected="$(sed -n 's/^const PROTOCOL_VERSION: u32 = \([0-9]*\);/\1/p' \
            src/simplegit/simplegit_daemon.rs)"
          test -n "$expected"
          grep -F "\"protocol\":$expected" <<<"$response"

      - name: Run Vim integration test against the built daemon
        run: make vim-integration

      - name: Commit flow end to end
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          make vim-commit

      - name: Compile every Vim9 def (lazy compilation hides cold-branch errors)
        run: make defcompile

      - name: simplecore supervisor regression suite
        run: make vim-core
